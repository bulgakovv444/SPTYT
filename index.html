  function buildDefaultDrivers() {

  function driverSearch(query) {
    const q = String(query || '').trim().toLowerCase();
    if (!q) return [];
    return Object.values(DRIVERS)
      .filter(d => d && d.name && d.name.toLowerCase().includes(q))
      .sort((a, b) => a.name.localeCompare(b.name, 'ru'))
      .slice(0, 12);
  }
  function canonicalDriverName(input) {
    const raw = String(input.value || '').trim();
    if (!raw) return '';
    const exact = Object.values(DRIVERS).find(d => d.name.toLowerCase() === raw.toLowerCase());
    if (exact) return exact.name;
    const pref = driverSearch(raw);
    return pref.length ? pref[0].name : raw;
  }
  function attachDriverAutocomplete(input) {
    if (!input || input.dataset.acBound) return;
    input.dataset.acBound = '1';
    input.setAttribute('autocomplete', 'off');
    const wrap = document.createElement('div');
    wrap.style.position = 'relative';
    input.parentNode.insertBefore(wrap, input);
    wrap.appendChild(input);
    const list = document.createElement('div');
    list.className = 'ac-list';
    list.style.cssText = 'display:none; position:absolute; top:100%; left:0; right:0; z-index:2000; background:#fff; border:2px solid #2563eb; border-radius:6px; max-height:240px; overflow-y:auto; box-shadow:0 8px 20px rgba(0,0,0,.2); margin-top:2px;';
    wrap.appendChild(list);
    let activeIdx = -1;
    function renderList() {
      const items = driverSearch(input.value);
      if (!items.length) { list.style.display = 'none'; list.innerHTML = ''; activeIdx = -1; return; }
      list.innerHTML = items.map((d, i) =>
        `<div class="ac-item" data-idx="${i}" data-name="${esc(d.name)}" style="padding:8px 10px; cursor:pointer; font-size:13px; border-bottom:1px solid #e2e8f0; ${i === activeIdx ? 'background:#dbeafe;' : ''}">${esc(d.name)}</div>`
      ).join('');
      list.style.display = 'block';
      list.querySelectorAll('.ac-item').forEach(el => {
        el.addEventListener('mousedown', e => {
          e.preventDefault();
          input.value = el.dataset.name;
          list.style.display = 'none';
          activeIdx = -1;
          input.dispatchEvent(new Event('change'));
        });
      });
    }

    input.addEventListener('focus', () => { if (input.value.trim()) renderList(); });
    input.addEventListener('blur', () => {
      setTimeout(() => { list.style.display = 'none'; }, 150);
      const canon = canonicalDriverName(input);
      if (canon && canon !== input.value) input.value = canon;
    });
    input.addEventListener('keydown', (e) => {
      const items = list.querySelectorAll('.ac-item');
      if (list.style.display === 'none' || !items.length) return;
      if (e.key === 'ArrowDown') { e.preventDefault(); activeIdx = Math.min(activeIdx + 1, items.length - 1); renderList(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); activeIdx = Math.max(activeIdx - 1, 0); renderList(); }
      else if (e.key === 'Enter') { if (activeIdx >= 0) { e.preventDefault(); input.value = items[activeIdx].dataset.name; list.style.display = 'none'; activeIdx = -1; } }

  // ============================================================
  // ПРОВЕРКА КОНФЛИКТОВ ВОДИТЕЛЕЙ
  // Водитель не может быть на двух РАЗНЫХ машинах в ОДНУ смену,
  // если обе машины активны (line). Машины в off/parts/bv не блокируют.
  // Один водитель в driver1 и driver2 одной машины — запрещено.
  // ============================================================
  function findShiftConflict(driverName, shiftField, excludeMachineId) {
    const name = String(driverName || '').trim().toLowerCase();
    if (!name) return null;
    for (const [id, m] of Object.entries(MACHINES)) {
      if (id === excludeMachineId) continue;
      const otherDriver = String(m[shiftField] || '').trim().toLowerCase();
      if (otherDriver !== name) continue;
      const st = m.lastStatus || 'line';
      // Блокирует только если та машина реально работает (line)
      if (st === 'line') return { machine: m, field: shiftField };
    }
    return null;
  }

  function checkDriverConflicts(driver1, driver2, excludeMachineId) {
    const conflicts = [];
    const d1 = String(driver1 || '').trim();
    const d2 = String(driver2 || '').trim();
    if (d1 && d2 && d1.toLowerCase() === d2.toLowerCase()) {
      conflicts.push({ name: d1, reason: 'указан в обеих сменах на одной машине' });
      return conflicts;
    }
    if (d1) {
      const c = findShiftConflict(d1, 'driver1', excludeMachineId);
      if (c) conflicts.push({ name: d1, machine: `${c.machine.num} ${c.machine.model || ''}`, shift: '1-я смена' });
    }
    if (d2) {
      const c = findShiftConflict(d2, 'driver2', excludeMachineId);
      if (c) conflicts.push({ name: d2, machine: `${c.machine.num} ${c.machine.model || ''}`, shift: '2-я смена' });
    }
    return conflicts;
  }

  // При пересадке водителя — стираем его из других машин в ТОЙ ЖЕ смене,
  // если та машина в статусе off (сход). Машина остаётся в off.
  async function clearDriverFromSameShift(driverName, shiftField, excludeMachineId) {
    const name = String(driverName || '').trim().toLowerCase();
    if (!name) return;
    for (const [id, m] of Object.entries(MACHINES)) {
      if (id === excludeMachineId) continue;
      const otherDriver = String(m[shiftField] || '').trim().toLowerCase();
      if (otherDriver !== name) continue;
      const st = m.lastStatus || 'line';
      if (st === 'off') {
        await update(ref(db, `machines/${id}/${shiftField}`), '');
        MACHINES[id][shiftField] = '';
      }
    }
  }

  let audioCtx = null;

    if (!("Notification" in window)) { notifyBtn.textContent = '🔕 Не поддерживается'; notifyBtn.className = 'btn-notify denied'; notifyBtn.disabled = true; return; }
    if (Notification.permission === 'granted') { notifyBtn.textContent = '🔔 Звук вкл'; notifyBtn.className = 'btn-notify enabled'; }
    else if (Notification.permission === 'denied') { notifyBtn.textContent = '🔕 Заблокировано'; notifyBtn.className = 'btn-notify denied'; notifyBtn.title = 'Разрешите уведомления в настройках браузера'; }
    else { notifyBtn.textContent = '🔔 Включить звук'; notifyBtn.className = 'btn-notify pulse-red'; }
  }
  function playNotificationSound() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
    osc.connect(gainNode); gainNode.connect(audioCtx.destination);
    osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
    osc.start(); osc.stop(audioCtx.currentTime + 0.5);
    setTimeout(() => {
      const osc2 = audioCtx.createOscillator(); const gainNode2 = audioCtx.createGain();
      osc2.connect(gainNode2); gainNode2.connect(audioCtx.destination);
      osc2.type = 'sine'; osc2.frequency.setValueAtTime(1100, audioCtx.currentTime);
      gainNode2.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gainNode2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
      osc2.start(); osc2.stop(audioCtx.currentTime + 0.5);

  function checkForNewOffStatus(machinesData) {

    let hasNewOff = false; let notificationMessage = "";

      if (currStatus === 'off' && prevStatus !== 'off') { hasNewOff = true; notificationMessage += `Машина ${m.num} ${m.model || ''} (${m.lastCause || 'Сход'}). `; }
      lastMachineStatuses[id] = currStatus;

  function buildDriversReport() {
    const dateFrom = $('drvDateFrom').value; const dateTo = $('drvDateTo').value;
    if (!dateFrom || !dateTo) return showToast('Укажите период', true);
    const pFrom = dateFrom.split('-'); const dFromStr = `${pFrom[2]}.${pFrom[1]}.${pFrom[0]}`;
    const pTo = dateTo.split('-'); const dToStr = `${pTo[2]}.${pTo[1]}.${pTo[0]}`;
    const search = ($('drvSearch')?.value || '').trim().toLowerCase();

    const stats = {}; // name -> { off, parts, bv, line, offMs, partsMs, bvMs, lineMs, causes: {cause: ms} }

    function ensure(name) {
      if (!stats[name]) stats[name] = { off: 0, parts: 0, bv: 0, line: 0, offMs: 0, partsMs: 0, bvMs: 0, lineMs: 0, causes: {} };
      return stats[name];
    }

    Object.values(eventLog).forEach(log => {
      if (!log.date || log.date < dFromStr || log.date > dToStr) return;
      const drv = String(log.driver || '').trim();
      if (!drv) return;
      const s = ensure(drv);
      const dur = log.duration || 0;
      if (log.status === 'off') { s.off++; s.offMs += dur; s.causes[log.cause || '—'] = (s.causes[log.cause || '—'] || 0) + dur; }
      else if (log.status === 'parts') { s.parts++; s.partsMs += dur; s.causes[log.cause || '—'] = (s.causes[log.cause || '—'] || 0) + dur; }
      else if (log.status === 'bv') { s.bv++; s.bvMs += dur; }
      else if (log.status === 'line') { s.line++; s.lineMs += dur; }
    });

    let rows = Object.entries(stats).map(([name, s]) => {
      const totalDowntime = s.offMs + s.partsMs + s.bvMs;
      const totalWork = s.lineMs;
      const base = totalWork + totalDowntime;
      const kpi = base > 0 ? Math.round((totalWork / base) * 100) : 0;
      return { name, ...s, totalDowntime, totalWork, kpi };
    });

    if (search) rows = rows.filter(r => r.name.toLowerCase().includes(search));

    if (!rows.length) {
      $('driversReportContent').innerHTML = '<p class="empty">Нет данных по водителям за выбранный период</p>';
      return;
    }

    rows.sort((a, b) => b.kpi - a.kpi || a.name.localeCompare(b.name, 'ru'));

    let html = `<table class="report-table">
      <thead>
        <tr>
          <th>Водитель</th>
          <th>Сходов</th>
          <th>Часы схода</th>
          <th>Ремонтов</th>
          <th>Часы ремонта</th>
          <th>БВ</th>
          <th>Часы БВ</th>
          <th>Отработано (на линии)</th>
          <th>Общий простой</th>
          <th>KPI</th>
        </tr>
      </thead>
      <tbody>`;
    rows.forEach(r => {
      let color = '#ef4444'; if (r.kpi >= 80) color = '#10b981'; else if (r.kpi >= 50) color = '#eab308';
      const causesStr = Object.entries(r.causes).sort((a, b) => b[1] - a[1]).map(([c, ms]) => `${esc(c)}: ${formatMs(ms)}`).join('<br>') || '—';
      html += `<tr>
        <td><strong>${esc(r.name)}</strong><div style="font-size:11px;color:#64748b;margin-top:4px;">${causesStr}</div></td>
        <td style="color:#854d0e;font-weight:600;">${r.off}</td>
        <td style="color:#854d0e;">${formatMs(r.offMs)}</td>

    if (drvSearch) drvSearch.addEventListener('input', () => { if ($('driversReportContent').querySelector('table')) buildDriversReport(); });
  });
</script>
